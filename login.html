<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="wrap">
  <header class="head">
    <span class="eyebrow">Partner portal</span>
    <h1>Sign in</h1>
    <p class="lede">Not registered yet? <a href="/register.html">Create a partner account</a>.</p>
  </header>

  <section class="card">
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign in</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>

<script src="/assets/login.js"></script>
</body>
</html>
