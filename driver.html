<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #EEF2F6;
    --surface: #FFFFFF;
    --surface-2: #F7F9FC;
    --ink: #0E2A47;
    --ink-2: #51677E;
    --line: #DEE4EA;
    --accent: #1476D4;
    --accent-soft: #EAF2FB;
    --accent-hover: #0F5FAE;
    --on-accent: #FFFFFF;
    --good: #1B6F46;
    --good-bg: #E1F2E9;
    --crit: #B42318;
    --crit-bg: #FCE6E3;
    --shadow-card: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 16px 16px 90px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin: 4px 0 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    padding: 16px;
    margin-bottom: 14px;
  }
  .route-row { display: flex; gap: 12px; }
  .route-track { display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
  .route-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .route-dot.end { background: var(--ink); }
  .route-dotted { flex: 1; width: 1px; min-height: 36px; margin: 4px 0; border-left: 2px dotted var(--line); }
  .route-addr { font-weight: 700; font-size: 15px; line-height: 1.35; }
  .route-addr + .route-addr { margin-top: 18px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; }
  .meta-item { min-width: 90px; }
  .meta-label { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .meta-val { font-size: 14px; font-weight: 600; }
  .flight-chip { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin: 10px 0 2px; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; }
  .passenger-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .tel-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; }
  .note-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13.5px; }
  .note-label { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .stage-list { display: flex; flex-direction: column; gap: 10px; }
  .stage-item { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .stage-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; }
  .stage-item.done .stage-check { background: var(--good); border-color: var(--good); color: #fff; }
  .stage-item.current .stage-check { border-color: var(--accent); }
  .stage-item.done span.label { color: var(--ink-2); text-decoration: line-through; }
  .stage-item.current span.label { font-weight: 700; }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(16,24,40,.06); }
  .actionbar-inner { max-width: 480px; margin: 0 auto; }
  button.primary {
    width: 100%; border: none; border-radius: 12px; background: var(--accent); color: var(--on-accent);
    font-family: inherit; font-size: 16px; font-weight: 700; padding: 15px; cursor: pointer;
  }
  button.primary:active { background: var(--accent-hover); }
  button.primary:disabled { opacity: .55; cursor: default; }
  .status-line { text-align: center; font-size: 12.5px; color: var(--crit); margin-top: 8px; min-height: 16px; }
  .done-banner { background: var(--good-bg); color: var(--good); border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 14.5px; text-align: center; }
  .error-screen { text-align: center; padding: 60px 20px; color: var(--ink-2); }
  .error-screen h1 { font-size: 17px; color: var(--ink); margin-bottom: 8px; }
  .skeleton { opacity: .5; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="eyebrow" id="eyebrow">…</div>
    <div class="card skeleton" id="loadingCard">…</div>
  </div>

<script>
(function () {
  var I18N = {
    en: { eyebrow: "Trip", pickup: "Pickup", dropoff: "Drop-off", date: "Date", time: "Pickup time", vehicle: "Vehicle", passengers: "Passengers", luggage: "Luggage", passenger: "Passenger", meet: "Meet & greet", sign: "Name sign", progress: "Trip progress", call: "Call", invalid_title: "Link not available", invalid_body: "This driver link is no longer active. Trips are only accessible while in progress.", err: "Could not update. Please try again.", done: "Trip completed — thank you!", stage_on_the_way: "On the way", stage_arrived: "Arrived at pickup", stage_in_car: "Passenger on board", stage_dropped_off: "Dropped off" },
    ru: { eyebrow: "Поездка", pickup: "Подача", dropoff: "Высадка", date: "Дата", time: "Время подачи", vehicle: "Авто", passengers: "Пассажиры", luggage: "Багаж", passenger: "Пассажир", meet: "Встреча", sign: "Табличка с именем", progress: "Статус поездки", call: "Позвонить", invalid_title: "Ссылка недоступна", invalid_body: "Эта ссылка для водителя больше не активна. Доступ есть только пока поездка выполняется.", err: "Не удалось обновить. Попробуйте ещё раз.", done: "Поездка завершена — спасибо!", stage_on_the_way: "В пути", stage_arrived: "Прибыл на подачу", stage_in_car: "Пассажир в машине", stage_dropped_off: "Высадка выполнена" },
    es: { eyebrow: "Viaje", pickup: "Recogida", dropoff: "Destino", date: "Fecha", time: "Hora de recogida", vehicle: "Vehículo", passengers: "Pasajeros", luggage: "Equipaje", passenger: "Pasajero", meet: "Recepción", sign: "Cartel con el nombre", progress: "Progreso del viaje", call: "Llamar", invalid_title: "Enlace no disponible", invalid_body: "Este enlace de conductor ya no está activo. Solo es accesible mientras el viaje está en curso.", err: "No se pudo actualizar. Inténtelo de nuevo.", done: "Viaje completado — ¡gracias!", stage_on_the_way: "En camino", stage_arrived: "Llegó al punto de recogida", stage_in_car: "Pasajero a bordo", stage_dropped_off: "Dejado en destino" },
    el: { eyebrow: "Διαδρομή", pickup: "Παραλαβή", dropoff: "Προορισμός", date: "Ημερομηνία", time: "Ώρα παραλαβής", vehicle: "Όχημα", passengers: "Επιβάτες", luggage: "Αποσκευές", passenger: "Επιβάτης", meet: "Υποδοχή", sign: "Πινακίδα με όνομα", progress: "Πρόοδος διαδρομής", call: "Κλήση", invalid_title: "Ο σύνδεσμος δεν είναι διαθέσιμος", invalid_body: "Αυτός ο σύνδεσμος οδηγού δεν είναι πλέον ενεργός. Η πρόσβαση ισχύει μόνο όσο η διαδρομή βρίσκεται σε εξέλιξη.", err: "Δεν ήταν δυνατή η ενημέρωση. Δοκιμάστε ξανά.", done: "Η διαδρομή ολοκληρώθηκε — ευχαριστούμε!", stage_on_the_way: "Καθ' οδόν", stage_arrived: "Έφτασε στο σημείο παραλαβής", stage_in_car: "Ο επιβάτης επιβιβάστηκε", stage_dropped_off: "Αποβιβάστηκε" },
    fr: { eyebrow: "Trajet", pickup: "Prise en charge", dropoff: "Destination", date: "Date", time: "Heure de prise en charge", vehicle: "Véhicule", passengers: "Passagers", luggage: "Bagages", passenger: "Passager", meet: "Accueil", sign: "Pancarte avec le nom", progress: "Progression du trajet", call: "Appeler", invalid_title: "Lien indisponible", invalid_body: "Ce lien chauffeur n'est plus actif. L'accès n'est possible que pendant que le trajet est en cours.", err: "Impossible de mettre à jour. Veuillez réessayer.", done: "Trajet terminé — merci !", stage_on_the_way: "En route", stage_arrived: "Arrivé au point de prise en charge", stage_in_car: "Passager à bord", stage_dropped_off: "Dépose effectuée" },
    pt: { eyebrow: "Viagem", pickup: "Embarque", dropoff: "Destino", date: "Data", time: "Hora de embarque", vehicle: "Veículo", passengers: "Passageiros", luggage: "Bagagem", passenger: "Passageiro", meet: "Receção", sign: "Placa com o nome", progress: "Progresso da viagem", call: "Ligar", invalid_title: "Link não disponível", invalid_body: "Este link de motorista já não está ativo. Só é acessível enquanto a viagem está em curso.", err: "Não foi possível atualizar. Tente novamente.", done: "Viagem concluída — obrigado!", stage_on_the_way: "A caminho", stage_arrived: "Chegou ao local de recolha", stage_in_car: "Passageiro a bordo", stage_dropped_off: "Largada efetuada" }
  };
  var STAGES = ["on_the_way", "arrived", "in_car", "dropped_off"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function qs(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var token = qs("t");
  var app = document.getElementById("app");
  var t = null; // i18n strings, set once we know the language

  function renderError(lang) {
    t = I18N[lang] || I18N.en;
    document.getElementById("eyebrow").textContent = "";
    app.innerHTML = '<div class="error-screen"><h1>' + esc(t.invalid_title) + "</h1><p>" + esc(t.invalid_body) + "</p></div>";
  }

  if (!token) {
    renderError("en");
    return;
  }

  function fmtDay(d) {
    if (!d) return "";
    try {
      var dt = new Date(d);
      var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
      return p2(dt.getDate()) + "/" + p2(dt.getMonth() + 1) + "/" + dt.getFullYear();
    } catch (e) { return d; }
  }

  function telHref(phone) {
    return "tel:" + String(phone).replace(/[^+\d]/g, "");
  }

  function stageListHtml(currentIndex) {
    return STAGES.map(function (key, i) {
      var state = i <= currentIndex ? "done" : (i === currentIndex + 1 ? "current" : "");
      var mark = i <= currentIndex ? "&#10003;" : (i + 1);
      return '<div class="stage-item ' + state + '"><div class="stage-check">' + mark + '</div><span class="label">' + esc(t["stage_" + key]) + "</span></div>";
    }).join("");
  }

  function render(o) {
    t = I18N[o.lang] || I18N.en;
    document.getElementById("eyebrow").textContent = t.eyebrow + (o.orderNumber ? " #" + o.orderNumber : "");

    var currentIndex = o.tripStage ? STAGES.indexOf(o.tripStage) : -1;
    var nextStage = currentIndex < STAGES.length - 1 ? STAGES[currentIndex + 1] : null;

    var tripCard = '<div class="card">' +
      '<div class="route-row">' +
      '<div class="route-track"><div class="route-dot"></div><div class="route-dotted"></div><div class="route-dot end"></div></div>' +
      '<div style="flex:1;min-width:0;">' +
      '<div class="route-addr">' + esc(o.pickup) + "</div>" +
      (o.flightNumber ? '<div class="flight-chip">Flight ' + esc(o.flightNumber) + (o.flightTime ? " · " + esc(o.flightTime) : "") + "</div>" : "") +
      '<div class="route-addr">' + esc(o.dropoff) + "</div>" +
      "</div></div>" +
      '<div class="meta-row">' +
      '<div class="meta-item"><div class="meta-label">' + esc(t.date) + '</div><div class="meta-val">' + esc(fmtDay(o.orderDate)) + "</div></div>" +
      '<div class="meta-item"><div class="meta-label">' + esc(t.time) + '</div><div class="meta-val">' + esc(o.orderTime || "—") + "</div></div>" +
      (o.vehicleType ? '<div class="meta-item"><div class="meta-label">' + esc(t.vehicle) + '</div><div class="meta-val">' + esc(o.vehicleType) + "</div></div>" : "") +
      (o.passengers ? '<div class="meta-item"><div class="meta-label">' + esc(t.passengers) + '</div><div class="meta-val">' + esc(o.passengers) + "</div></div>" : "") +
      (o.luggage ? '<div class="meta-item"><div class="meta-label">' + esc(t.luggage) + '</div><div class="meta-val">' + esc(o.luggage) + "</div></div>" : "") +
      "</div>" +
      (o.meetGreet ? '<div class="note-box"><div class="note-label">' + esc(t.meet) + '</div>' + esc(o.meetGreet) + "</div>" : "") +
      (o.signText ? '<div class="note-box"><div class="note-label">' + esc(t.sign) + '</div>' + esc(o.signText) + "</div>" : "") +
      "</div>";

    var passengerCard = (o.passengerName || o.passengerPhone)
      ? '<div class="card"><h2>' + esc(t.passenger) + "</h2>" +
        (o.passengerName ? '<div class="passenger-name">' + esc(o.passengerName) + "</div>" : "") +
        (o.passengerPhone
          ? '<a class="tel-link" href="' + esc(telHref(o.passengerPhone)) + '">' +
            '<svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4 3h3l1.5 4-2 1.3a9 9 0 0 0 5.2 5.2l1.3-2 4 1.5v3a2 2 0 0 1-2 2A13 13 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>' +
            esc(t.call) + ": " + esc(o.passengerPhone) + "</a>"
          : "") +
        "</div>"
      : "";

    var progressCard = '<div class="card"><h2>' + esc(t.progress) + '</h2><div class="stage-list">' + stageListHtml(currentIndex) + "</div></div>";

    app.innerHTML = tripCard + passengerCard + progressCard;

    if (nextStage) {
      var bar = document.createElement("div");
      bar.className = "actionbar";
      bar.innerHTML = '<div class="actionbar-inner">' +
        '<button type="button" class="primary" id="nextBtn">' + esc(t["stage_" + nextStage]) + "</button>" +
        '<div class="status-line" id="statusLine"></div>' +
        "</div>";
      document.body.appendChild(bar);
      document.getElementById("nextBtn").addEventListener("click", function () {
        var btn = this;
        btn.disabled = true;
        document.getElementById("statusLine").textContent = "";
        fetch("/api/driver/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, stage: nextStage })
        }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error((res.data && res.data.error) || "error");
            if (nextStage === "dropped_off") {
              bar.remove();
              app.innerHTML = tripCard + passengerCard +
                '<div class="card"><div class="done-banner">' + esc(t.done) + "</div></div>";
            } else {
              o.tripStage = nextStage;
              render(o);
            }
          })
          .catch(function () {
            document.getElementById("statusLine").textContent = t.err;
            btn.disabled = false;
          });
      });
    }
  }

  fetch("/api/driver/view?t=" + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (res) {
      if (!res.ok || !res.data || !res.data.ok) { renderError((res.data && res.data.lang) || "en"); return; }
      render(res.data);
    })
    .catch(function () { renderError("en"); });
})();
</script>
</body>
</html>
